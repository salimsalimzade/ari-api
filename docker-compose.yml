name: ari
services:
  postgres:
    image: postgres:18
    container_name: ari-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ari}
      POSTGRES_USER: ${DB_USERNAME:-ari}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: ari-api
    build: .
    ports: ["${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ari}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
