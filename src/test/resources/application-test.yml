# Tests get their database from Testcontainers (IntegrationTestConfiguration) and never read .env.
spring:
  mail:
    # A fake login; the Mailpit test container accepts any (host and port come from the container)
    username: ari-test
    password: ari-test-only

app:
  seed-demo-data: true
  auth:
    # Supabase Auth is FakeSupabaseAuth in the tests; nothing calls this address
    supabase-url: http://supabase.test
    supabase-secret-key: sb_secret_test-only
    api-url: http://localhost:8080
