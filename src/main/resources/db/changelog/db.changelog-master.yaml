# Applied in order at startup. Never edit an applied file; add a new numbered one instead.
databaseChangeLog:
  - include:
      file: v1/001-create-users.yaml
      relativeToChangelogFile: true
  - include:
      file: v1/002-create-oauth-accounts.yaml
      relativeToChangelogFile: true
  - include:
      file: v1/003-create-refresh-tokens.yaml
      relativeToChangelogFile: true
