databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: ari
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: users_pkey
              - column:
                  name: email
                  type: varchar(320)
                  constraints:
                    unique: true
                    uniqueConstraintName: users_email_key
              - column:
                  name: username
                  type: varchar(30)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: users_username_key
              - column:
                  name: password_hash
                  type: varchar(100)
              - column:
                  name: full_name
                  type: varchar(150)
                  constraints:
                    nullable: false
              - column:
                  name: birth_date
                  type: date
              - column:
                  name: avatar_key
                  type: varchar(512)
              - column:
                  name: plan
                  type: varchar(10)
                  defaultValue: NONE
                  constraints:
                    nullable: false
              - column:
                  name: saves_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: email_verified_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE users
              ADD CONSTRAINT users_username_check
                CHECK (username = lower(username) AND username ~ '^[a-z0-9_.]{3,30}$'),
              ADD CONSTRAINT users_plan_check CHECK (plan IN ('NONE', 'HIVE')),
              ADD CONSTRAINT users_saves_count_check CHECK (saves_count >= 0)
      rollback:
        - dropTable:
            tableName: users
