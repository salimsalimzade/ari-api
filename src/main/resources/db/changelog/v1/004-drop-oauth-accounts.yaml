databaseChangeLog:
  - changeSet:
      id: 004-drop-oauth-accounts
      author: ari
      changes:
        - dropTable:
            tableName: oauth_accounts
            cascadeConstraints: true
      # Google sign-in is postponed; recreate the table from 002 when it returns.
      rollback:
        - sql:
            sql: >-
              CREATE TABLE oauth_accounts (
              id uuid PRIMARY KEY,
              user_id uuid NOT NULL REFERENCES users (id) ON DELETE CASCADE,
              provider varchar(20) NOT NULL,
              provider_user_id varchar(255) NOT NULL,
              email varchar(320),
              created_at timestamptz NOT NULL DEFAULT now(),
              CONSTRAINT oauth_accounts_provider_user_key UNIQUE (provider, provider_user_id),
              CONSTRAINT oauth_accounts_user_provider_key UNIQUE (user_id, provider),
              CONSTRAINT oauth_accounts_provider_check CHECK (provider IN ('GOOGLE')))
