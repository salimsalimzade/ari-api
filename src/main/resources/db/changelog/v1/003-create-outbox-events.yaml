databaseChangeLog:
  - changeSet:
      id: 003-create-outbox-events
      author: ari
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              # Also the event id that consumers deduplicate by.
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: outbox_events_pkey
              - column:
                  name: aggregate_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: routing_key
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: sent_at
                  type: timestamptz
        # The publisher only reads unsent rows, oldest first.
        - sql:
            sql: >-
              CREATE INDEX outbox_events_unsent_idx ON outbox_events (created_at)
              WHERE sent_at IS NULL
      rollback:
        - dropTable:
            tableName: outbox_events
