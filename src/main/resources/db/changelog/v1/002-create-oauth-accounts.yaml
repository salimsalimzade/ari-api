databaseChangeLog:
  - changeSet:
      id: 002-create-oauth-accounts
      author: ari
      changes:
        - createTable:
            tableName: oauth_accounts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: oauth_accounts_pkey
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: oauth_accounts_user_id_fkey
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: provider
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: provider_user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(320)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: oauth_accounts
            columnNames: provider, provider_user_id
            constraintName: oauth_accounts_provider_user_key
        - addUniqueConstraint:
            tableName: oauth_accounts
            columnNames: user_id, provider
            constraintName: oauth_accounts_user_provider_key
        - sql:
            sql: >-
              ALTER TABLE oauth_accounts
              ADD CONSTRAINT oauth_accounts_provider_check CHECK (provider IN ('GOOGLE'))
      rollback:
        - dropTable:
            tableName: oauth_accounts
