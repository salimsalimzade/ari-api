databaseChangeLog:
  - changeSet:
      id: 010-create-imports
      author: ari
      changes:
        # An uploaded file, from the upload until its review is saved (docs/database.md 1.4).
        - createTable:
            tableName: imports
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: imports_pkey
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: imports_user_id_fkey
                    references: users(id)
                    deleteCascade: true
              # The file's source, made when reading finds marks.
              - column:
                  name: source_id
                  type: uuid
                  constraints:
                    unique: true
                    uniqueConstraintName: imports_source_id_key
              - column:
                  name: file_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              # Counts against the upload space.
              - column:
                  name: size_bytes
                  type: bigint
                  constraints:
                    nullable: false
              # Null once the file is deleted from storage.
              - column:
                  name: storage_key
                  type: varchar(512)
              - column:
                  name: status
                  type: varchar(12)
                  defaultValue: QUEUED
                  constraints:
                    nullable: false
              # Retry reads the file again.
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: error_code
                  type: varchar(50)
              - column:
                  name: read_at
                  type: timestamptz
              - column:
                  name: reviewed_at
                  type: timestamptz
              - column:
                  name: dismissed_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE imports
              ADD CONSTRAINT imports_status_check CHECK (status IN
                ('QUEUED', 'READING', 'READY', 'SAVED', 'EMPTY', 'FAILED', 'DISCARDED')),
              ADD CONSTRAINT imports_size_bytes_check CHECK (size_bytes > 0),
              ADD CONSTRAINT imports_attempts_check CHECK (attempts > 0)
        - addForeignKeyConstraint:
            constraintName: imports_source_id_fkey
            baseTableName: imports
            baseColumnNames: source_id
            referencedTableName: sources
            referencedColumnNames: id
            onDelete: SET NULL
        - sql:
            sql: CREATE INDEX imports_user_created_idx ON imports (user_id, created_at DESC, id DESC)
        # What reading found in the file, in its order, until the review saves or skips it.
        - createTable:
            tableName: import_marks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: import_marks_pkey
              - column:
                  name: import_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: import_marks_import_id_fkey
                    references: imports(id)
                    deleteCascade: true
              # The save it became; deleting the save in the Library unticks the mark.
              - column:
                  name: save_id
                  type: uuid
                  constraints:
                    unique: true
                    uniqueConstraintName: import_marks_save_id_key
              - column:
                  name: position
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(12)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: varchar(10)
                  constraints:
                    nullable: false
              # The file's own color when it was mapped to one of the five (ORANGE, RED).
              - column:
                  name: file_color
                  type: varchar(20)
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: page_number
                  type: int
              - column:
                  name: comment
                  type: text
              # A picture of the spot, for a drawn or handwritten mark.
              - column:
                  name: image_key
                  type: varchar(512)
              - column:
                  name: selected
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: import_marks_save_id_fkey
            baseTableName: import_marks
            baseColumnNames: save_id
            referencedTableName: saves
            referencedColumnNames: id
            onDelete: SET NULL
        - addUniqueConstraint:
            tableName: import_marks
            constraintName: import_marks_import_position_key
            columnNames: import_id, position
        - sql:
            sql: >-
              ALTER TABLE import_marks
              ADD CONSTRAINT import_marks_type_check CHECK (type IN
                ('HIGHLIGHT', 'UNDERLINE', 'DRAWN', 'HANDWRITTEN', 'STRIKE', 'NOTE')),
              ADD CONSTRAINT import_marks_color_check CHECK (color IN
                ('YELLOW', 'GREEN', 'BLUE', 'PINK', 'PURPLE')),
              ADD CONSTRAINT import_marks_page_number_check CHECK (page_number > 0),
              ADD CONSTRAINT import_marks_position_check CHECK (position >= 0)
      rollback:
        - dropTable:
            tableName: import_marks
        - dropTable:
            tableName: imports
